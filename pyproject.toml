[project]
name = "cotlang"
version = "0.2.0"
description = "Hint uptake vs hint disclosure across trace languages (CoT faithfulness x language)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "pandas>=2.2",
    "numpy>=1.26,<2",
    "scipy>=1.13",
    "fasttext-wheel>=0.9.2",
    "anthropic>=1.0",
    "pydantic>=2",
    "tqdm>=4.66",
    "tabulate>=0.9",
    "tokenizers>=0.19",
    "statsmodels>=0.14",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cotlang"]
