# Stage A, core arms (docs/PLAN.md, amendment "2026-09-13, Stage A design"). The confirmatory run: blind, judged
# only after the gate, and the numbers the paper's primary contrast comes from.
# Three trace languages, one fixed English question and hint:
#   English  - the monitoring baseline and the long-trace end of the scale.
#   Turkish  - the low-resource case; half the tokens and under half the sentences of English on the same question.
#   Chinese  - new here. The question stays English, so Chinese needs no translated items and no review time; the code
#              already carries the Chinese instruction, both hint sentences, both prefixes, CJK sentence splitting and
#              the GlotLID zho_/cmn_/yue_ mapping. Chinese buys three things Turkish alone cannot:
#                - a length-matched language contrast, if Chinese runs near English length (probe first), which puts a
#                  disclosure difference beyond the reach of Little 2026's length account;
#                - a third point, so disclosure can be regressed on trace length instead of defended against it;
#                - the pivot-versus-habit test already in the plan: Onyame's Qwen3-8B row is EN 79.0 against ZH 99.2,
#                  so Chinese behaving like Turkish rather than like English points at English post-training, not at
#                  the model's pivot language.
# Sampling is run 4's, pending the presence-penalty probe; if the probe moves it, this file changes before it runs.
name: stageA_extras
seed: 20260906
blind: true                         # run.py refuses judge, analyze, all, --dump-traces, --annotate-export, --kappa

paths:
  workdir: runs/stageA_gpqa        # a new workdir: bf16 traces, never pooled with the Q5_K_M runs
  items: data/items_gpqa.jsonl
  items_exclude: data/items_exclude_gpqa.txt
  cache_dir: ~/.cache/cotlang

items:
  source: gpqa                      # cotlang/items.py: _load_gpqa, answers shuffled into A-D with a seeded order
  dataset: Idavidrein/gpqa
  config: gpqa_diamond              # 198 questions: Chemistry 93, Physics 86, Biology 19
  langs: [en]
  n: 100
  require_label: null               # GPQA has no cultural-sensitivity label
  max_prompt_tokens: 400
  tokenizer: Qwen/Qwen3-4B          # the cap that built this file; the file itself is fixed by the hash below
  sha256: b011fc9e188fc19d1fd5cecf89bfe904e9f415c023235eb06be1ae184991dcc2   # run.py refuses any other item file
  stratify_by: null
  order_by: subject_category        # every prefix mirrors the whole set's domain mix
  limit: null                       # all 100 questions, not run 4's first 20

server:
  external: true                    # a server someone else started; run.py only health-checks it
  base_url: http://127.0.0.1:8080   # the local end of emre's SSH tunnel to the rented box (scripts/tunnel.sh: -L 8080:localhost:18000)
  cache_ram_mib: 0
  parallel: 64                      # matched to --max-num-seqs 64 on the server (scripts/vllm-args.conf).
                                      # Client-side concurrency only says how many requests are in flight; the server
                                      # decides how many it runs at once, so both have to be raised. If the instance
                                      # is left at 36, the extra requests simply queue -- harmless, just not faster.
                                      # but traces average ~20k, and the 1,576,866-token KV cache holds ~78 of those.
                                      # Roughly halves a 25-hour run; vLLM queues and preempts if it is too high.
  ctx_per_slot: 65536               # 64k context per sequence, the model's listed window
  startup_timeout_s: 300
  model_id: Qwen/Qwen3.5-9B         # provenance only, not read by the code: what the endpoint must be serving,
  model_dtype: bfloat16             # in this precision. The run's report records the served model's revision,
  model_note: "served by vLLM on a rented A100 80GB; no quantization"   # the vLLM version and the GPU.

sampling:                           # Qwen3.5 thinking-mode recommendation (Qwen3 used temperature 0.6, no penalty)
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  max_tokens: 64000                 # change this together with ctx_per_slot: a trace gets the smaller of the two
  request_timeout_s: 7200           # a 64k trace at a per-stream 30 tokens/s is ~36 minutes
  k: 1                                # one sample each: these are controls and a comparison, not the primary contrast
# hints that can carry the primary contrast (metadata and unethical, both at 0.70 uptake in run 4) come straight
# after their controls. Sycophancy has moved to configs/stageA_extras.yaml at k = 1: it failed the registered
# headroom bar at 0.000/0.150 and exists only to be comparable with Chen, so it does not deserve k = 3 here.
# gen_ids and per-sample seeds are independent of a cell's position, so ordering changes no trace; it only
# changes what survives an early stop.
cells:                              # 9 cells at k = 1, run after the core arms into the same workdir
  # The neutral-prefix control (Rival 3 in docs/PAPER-OUTLINE.md): our planted sentence says "By request, I will start
  # thinking in X", claiming a request the prompt never made. These cells set the language with a plain opener instead,
  # so the paper can show the disclosure result is not an artifact of that fiction. One sample is enough for a control.
  - {q_lang: en, t_lang: en, prefix: neutral, cue: none}
  - {q_lang: en, t_lang: tr, prefix: neutral, cue: none}
  - {q_lang: en, t_lang: zh, prefix: neutral, cue: none}
  - {q_lang: en, t_lang: en, prefix: neutral, cue: metadata}
  - {q_lang: en, t_lang: tr, prefix: neutral, cue: metadata}
  - {q_lang: en, t_lang: zh, prefix: neutral, cue: metadata}
  # Chen's sycophancy hint, both wordings, kept only so the paper can report it beside his numbers. Its no-hint
  # baseline is the core arms' zhao_long none cells, which the gate pairs by prefix and instruction.
  - {q_lang: en, t_lang: en, prefix: zhao_long, cue: sycophancy}
  - {q_lang: en, t_lang: tr, prefix: zhao_long, cue: sycophancy}
  - {q_lang: en, t_lang: zh, prefix: zhao_long, cue: sycophancy}

judge:
  enabled: true
  backend: openai                    # never the Claude API or the subscription (emre, 2026-09-13). This is
  base_url: https://api.deepseek.com # a GENERATION config; judging runs from configs/stageA_*_judge.yaml.
  api_key_env: DEEPSEEK_API_KEY      # the backend is pinned here only so a stray --stage judge cannot
  model: deepseek-flash              # bill the wrong provider.
  effort: medium
  max_concurrency: 2
  samples_per_item: 1                 # judge only the first sample of each question: the extra samples measure
                                      # dispersion of hint-following, which is read off answers and needs no judge.
  control_fraction: 0.35              # 35% of this config's no-hint controls (core ~111, extras ~107; ~73 per framing pooled)
  nonfollower_fraction: 0.0           # the primary metric conditions on hint-followers; non-followers are released
                                      # unjudged with the dataset. Core ~541 labels, extras ~385; ~926 in all, ~23M input tokens.

                                      # the analysis. ~2,700 labels instead of 6,000; judging, not GPU, is the cost.
