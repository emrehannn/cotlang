# JUDGING TWIN of configs/stageB_tr.yaml (pattern: configs/stageA_core_judge.yaml): same workdir, cells, seed and
# items; only `name` and `blind: false` differ, and this file is used for `--stage judge` (with --unblind, once the
# gate has been run and committed) and `--stage analyze` ONLY. Judge block identical to the Stage A core twin (A+).
# Stage B, the Turkish-question mirror (docs/PLAN.md twenty-fifth addendum, 2026-09-15; docs/ROADMAP.md step 9).
# Stage A held the question and the hint in English and moved only the thinking language. Stage B translates the whole
# prompt -- instruction, question, options and hint -- into Turkish (emre's verified translation of the same 100 GPQA
# Diamond questions, data/items_gpqa_tr.jsonl, same ids, letters and option order as data/items_gpqa.jsonl) and again
# moves only the thinking language, Turkish or English. Together with Stage A that separates "the prompt is Turkish"
# from "the thinking is Turkish", which Onyame's whole-prompt-translated setting cannot. Blind, gated and judged like
# Stage A; k = 1 (600 traces); the Stage A no-hint English-question cells are the cross-stage baseline, paired by question.
name: stageB_tr_judge
seed: 20260906                      # Stage A's seed: the same per-question hint letters and option order
blind: false                        # the judging twin; see the header

paths:
  workdir: runs/stageB_tr           # its own workdir, so its .blind marker cannot re-close the judged Stage A workdir
  items: data/items_gpqa_tr.jsonl   # built by scripts/build_items_tr.py from the verified sheet; never rebuilt by run.py
  items_exclude: data/items_exclude_gpqa.txt
  cache_dir: ~/.cache/cotlang

items:
  source: gpqa
  dataset: Idavidrein/gpqa
  config: gpqa_diamond
  langs: [en, tr]                   # informational: the file is pre-built; cotlang/items.py would refuse to build it
  n: 100
  require_label: null
  max_prompt_tokens: 400            # the cap that built the ENGLISH file; the Turkish prompts reach 500 tokens (Qwen3-4B tokenizer)
  tokenizer: Qwen/Qwen3-4B
  sha256: aa37267cf279fe47e5bd5af7787f6727d222fa28bc0a7f9ddf05ba16d871d892   # run.py refuses any other item file
  stratify_by: null
  order_by: subject_category
  limit: null

server:                             # identical to Stage A: rented A100 80GB, vLLM, bf16, through scripts/tunnel.sh
  external: true
  base_url: http://127.0.0.1:8080
  cache_ram_mib: 0
  parallel: 64
  ctx_per_slot: 65536
  startup_timeout_s: 300
  model_id: Qwen/Qwen3.5-9B
  model_dtype: bfloat16
  model_note: "served by vLLM on a rented A100 80GB; no quantization"

sampling:                           # IDENTICAL to Stage A (configs/stageA_core.yaml)
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  max_tokens: 64000
  request_timeout_s: 7200
  k: 1                              # 6 cells x 100 questions = 600 traces, about 2.5 hours at Stage A's throughput

# CELL ORDER IS PRIORITY ORDER (cell-major generation): the two controls, then the metadata pair, then unethical, so an
# early stop still leaves a complete Turkish/English metadata contrast. cue_lang defaults to q_lang, i.e. the hint is in
# Turkish: the whole prompt is Turkish, which is the mirror this stage exists for.
cells:
  - {q_lang: tr, t_lang: tr, prefix: zhao_long, cue: none}
  - {q_lang: tr, t_lang: en, prefix: zhao_long, cue: none}
  - {q_lang: tr, t_lang: tr, prefix: zhao_long, cue: metadata}
  - {q_lang: tr, t_lang: en, prefix: zhao_long, cue: metadata}
  - {q_lang: tr, t_lang: tr, prefix: zhao_long, cue: unethical}
  - {q_lang: tr, t_lang: en, prefix: zhao_long, cue: unethical}

judge:
  enabled: true
  backend: openai                    # DeepSeek over its OpenAI-compatible API: the registered bulk judge. Never the
  base_url: https://api.deepseek.com # Claude API or the subscription (emre, 2026-09-13). Key from $DEEPSEEK_API_KEY.
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-flash              # from GET /v1/models on 2026-09-14: deepseek-flash, deepseek-v4-pro.
                                     # deepseek-chat does not exist on this account. Recorded per label.
  temperature: 0.0                   # VENDOR-CONFIRMED DECORATIVE, 2026-09-14. DeepSeek's docs: thinking mode "does
                                     # not support the temperature, presence_penalty, or frequency_penalty parameters
                                     # ... setting these parameters will not trigger an error but will also have no
                                     # effect", and the same page states thinking mode is ON by default (effort high).
                                     # That is the mechanism behind the four-different-answers-at-temperature-0
                                     # finding; it is not a bug in this call. Kept in the config and the cache key so a
                                     # future endpoint that honours it cannot silently share labels with one that did
                                     # not. Reliability therefore has to be BOUGHT (roadmap 5a, scripts/judge_probe.py).
  max_tokens: 65536                  # OUTPUT budget, not context: deepseek-flash bills its reasoning out of
                                     # this, and the 2026-09-14 demo saw up to 5,472 reasoning tokens per label. An
                                     # unused ceiling costs nothing, so it is set well clear of anything observed.
                                     # The endpoint's ceiling is 384K (393216) and its thinking-mode default is 64K,
                                     # so this sits just under the default; the ~1M figure is the INPUT context and
                                     # lives in max_input_tokens below.
  effort: medium                     # DOES NOT REACH THE WIRE on this backend -- judge.py sends only the OpenAI-format
                                     # fields, and DeepSeek maps medium to high anyway. Kept so the cache key stays
                                     # well-formed. Use reasoning_effort if effort ever needs to be controlled.
  max_concurrency: 4
  max_input_tokens: 500000           # DeepSeek V4 serves a ~1M context, so nothing in Stage A truncates:
                                     # our longest selected trace estimates at ~101k input tokens. The guard
                                     # stays as a safety net, and if it ever fires the trace keeps its think
                                     # HEAD and whole final answer and is flagged `input_truncated`, so a
                                     # null index counts as censored (PLAN fifteenth addendum, item 4).
  samples_per_item: null              # A+ (roadmap step 3, PLAN twenty-second addendum): judge ALL k samples of each
                                      # question, not just the first. Was 1 (scope A). The only parameter that changes.
                                      # dispersion of hint-following, which is read off answers and needs no judge.
  control_fraction: 0.35              # 35% of this config's no-hint controls (core ~111, extras ~107; ~73 per framing pooled)
  nonfollower_fraction: 0.0           # the primary metric conditions on hint-followers; non-followers are released
                                      # unjudged with the dataset. Core ~541 labels, extras ~385; ~926 in all, ~23M input tokens.

                                      # the analysis. ~2,700 labels instead of 6,000; judging, not GPU, is the cost.
